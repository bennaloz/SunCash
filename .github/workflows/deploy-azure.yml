name: Deploy Azure

# Avvio manuale da Actions → «Deploy Azure» → Run workflow. Guida: docs/deploy-azure.md.
on:
  workflow_dispatch:

permissions:
  id-token: write # login ad Azure con credenziale federata: nessuna password Azure nei secret
  contents: read

concurrency: deploy-azure

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-suncash' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}

jobs:
  deploy:
    name: Deploy su Azure Container Apps
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Servizi Azure necessari
        run: |
          for ns in Microsoft.App Microsoft.OperationalInsights Microsoft.ContainerRegistry Microsoft.Storage; do
            az provider register --namespace "$ns" --wait
          done

      - name: Gruppo di risorse e registro delle immagini
        run: |
          # Nome del registro: unico al mondo, ricavato dalla sottoscrizione senza esporla nei log.
          REGISTRY="suncash$(echo -n '${{ secrets.AZURE_SUBSCRIPTION_ID }}' | sha256sum | cut -c1-10)"
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none
          LOGIN_SERVER=$(az deployment group create --resource-group "$RESOURCE_GROUP" \
            --template-file infra/registry.bicep --parameters registryName="$REGISTRY" \
            --query properties.outputs.loginServer.value --output tsv)
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Immagini
        run: |
          az acr login --name "$REGISTRY"
          docker build -f src/SunCash.Api/Dockerfile -t "$LOGIN_SERVER/suncash-api:$GITHUB_SHA" .
          docker build -t "$LOGIN_SERVER/suncash-web:$GITHUB_SHA" src/SunCash.Web
          docker push "$LOGIN_SERVER/suncash-api:$GITHUB_SHA"
          docker push "$LOGIN_SERVER/suncash-web:$GITHUB_SHA"

      - name: App
        env:
          FS_BASE_URL: ${{ vars.FUSIONSOLAR_BASE_URL }}
          FS_USER: ${{ secrets.FUSIONSOLAR_USERNAME }}
          FS_CODE: ${{ secrets.FUSIONSOLAR_SYSTEMCODE }}
          FS_STATION: ${{ secrets.FUSIONSOLAR_STATIONCODE }}
          GME_USER: ${{ secrets.GME_USERNAME }}
          GME_PASSWORD: ${{ secrets.GME_PASSWORD }}
          AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
          AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
          START_DATE: ${{ vars.SYNC_START_DATE || '2026-01-01' }}
          ZONE: ${{ vars.VALUATION_ZONE || 'NORD' }}
        run: |
          az deployment group create --resource-group "$RESOURCE_GROUP" --template-file infra/main.bicep \
            --parameters registryName="$REGISTRY" \
              apiImage="$LOGIN_SERVER/suncash-api:$GITHUB_SHA" webImage="$LOGIN_SERVER/suncash-web:$GITHUB_SHA" \
              syncStartDate="$START_DATE" valuationZone="$ZONE" fusionSolarBaseUrl="$FS_BASE_URL" \
              fusionSolarUserName="$FS_USER" fusionSolarSystemCode="$FS_CODE" fusionSolarStationCode="$FS_STATION" \
              gmeUserName="$GME_USER" gmePassword="$GME_PASSWORD" \
              authClientId="$AUTH_CLIENT_ID" authClientSecret="$AUTH_CLIENT_SECRET" \
            --query properties.outputs --output json > outputs.json
          URL=$(jq -r .url.value outputs.json)
          REDIRECT=$(jq -r .loginRedirectUri.value outputs.json)
          {
            echo "### SunCash su Azure"
            if [ -n "$AUTH_CLIENT_ID" ]; then
              echo "App: $URL (accesso con account Microsoft)"
            else
              echo "App creata ma **non esposta su internet**: manca il login. Registra l'app di login con"
              echo "questo indirizzo di ritorno, poi rilancia il deploy (docs/deploy-azure.md, passo 5):"
              echo ""
              echo "\`$REDIRECT\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
